<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Portal do cliente</title>
  <link rel="icon" type="image/svg+xml" href="img/nexofrete-icone.svg" />
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body>
  <!-- Entrada -->
  <section id="ptEntrada" class="pt-entrada oculto">
    <div class="pt-marca"><img id="ptLogo" class="oculto" alt="" /><div><h1 id="ptNomeEmpresa">Portal do cliente</h1><p>Acompanhe suas cargas, documentos e faturas.</p></div></div>
    <form id="ptFormEntrar" class="cartao" autocomplete="on">
      <div><label for="ptEmail">E-mail</label><input id="ptEmail" type="email" autocomplete="username" required /></div>
      <div><label for="ptSenha">Senha</label><input id="ptSenha" type="password" autocomplete="current-password" required /></div>
      <button type="submit">Entrar</button>
      <p id="ptErroEntrar" class="erro oculto"></p>
      <button type="button" id="ptEsqueci" class="pt-link">Esqueci a senha</button>
    </form>
    <form id="ptFormEsqueci" class="cartao oculto">
      <p style="margin-top:0;">Informe o seu e-mail. Vamos mandar um link para você criar uma senha nova.</p>
      <div><label for="ptEsqEmail">E-mail</label><input id="ptEsqEmail" type="email" required /></div>
      <button type="submit">Enviar o link</button>
      <p id="ptMsgEsqueci" class="ok oculto"></p>
      <button type="button" class="pt-link" data-pt-voltar>← Voltar</button>
    </form>
    <form id="ptFormSenha" class="cartao oculto">
      <h2 id="ptSenhaTitulo">Crie a sua senha</h2>
      <p id="ptSenhaTexto" class="fraco" style="margin-top:0; font-size:13.5px;">Use pelo menos 8 caracteres, com letras e números.</p>
      <div id="ptCampoAtual"><label for="ptSenhaAtual">Senha atual (a provisória)</label><input id="ptSenhaAtual" type="password" autocomplete="current-password" /></div>
      <div><label for="ptSenhaNova">Senha nova</label><input id="ptSenhaNova" type="password" autocomplete="new-password" required /></div>
      <div><label for="ptSenhaConf">Repita a senha nova</label><input id="ptSenhaConf" type="password" autocomplete="new-password" required /></div>
      <button type="submit">Salvar a senha</button>
      <p id="ptErroSenha" class="erro oculto"></p>
    </form>
    <p id="ptContato" class="fraco" style="text-align:center; font-size:12.5px;"></p>
  </section>

  <!-- Aplicativo -->
  <div id="ptApp" class="oculto">
    <header class="pt-topo">
      <div class="pt-topo-in">
        <img id="ptLogoApp" class="oculto" alt="" />
        <div><div class="nome" id="ptNomeApp"></div><div class="cliente" id="ptCliente"></div></div>
        <span class="espaco"></span>
        <button class="sec" id="ptMinhaSenha" title="Trocar a senha">🔑</button>
        <button class="sec" id="ptSair">Sair</button>
      </div>
      <nav class="pt-abas" id="ptAbas">
        <button data-aba="inicio" class="ativa">Início</button>
        <button data-aba="cargas">Cargas</button>
        <button data-aba="financeiro" id="ptAbaFin">Financeiro</button>
        <button data-aba="coletas">Coletas</button>
        <button data-aba="cotacoes">Cotações</button>
      </nav>
    </header>
    <main class="pt-app">
      <section data-pagina="inicio"><div id="ptInicio"></div></section>
      <section data-pagina="cargas" class="oculto">
        <div class="pt-barra"><h2>Cargas</h2><button class="sec" id="ptXmlLote">⬇ XML do período (.zip)</button></div>
        <div class="pt-filtros" id="ptFiltrosCargas">
          <button data-filtro="transito" class="ativo">Em andamento</button><button data-filtro="atrasadas">Atrasadas</button>
          <button data-filtro="entregues">Entregues</button><button data-filtro="todas">Todas</button>
          <input id="ptBuscaCargas" placeholder="Nota fiscal, CT-e, cidade ou nome" aria-label="Buscar" />
        </div>
        <div id="ptCargas" class="pt-lista"></div>
      </section>
      <section data-pagina="financeiro" class="oculto"><div class="pt-barra"><h2>Faturas</h2></div><div id="ptFaturas" class="pt-lista"></div></section>
      <section data-pagina="coletas" class="oculto"><div class="pt-barra"><h2>Coletas</h2><button id="ptNovaColeta">＋ Pedir coleta</button></div><div id="ptColetas" class="pt-lista"></div></section>
      <section data-pagina="cotacoes" class="oculto"><div class="pt-barra"><h2>Cotações</h2><button id="ptNovaCotacao">＋ Pedir cotação</button></div><div id="ptCotacoes" class="pt-lista"></div></section>
    </main>
  </div>

  <div id="ptFundo" class="pt-fundo oculto"><div class="pt-janela" id="ptJanela" role="dialog" aria-modal="true"></div></div>
  <script src="js/linkSeguro.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
