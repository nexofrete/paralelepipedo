<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="35%" stop-color="#3b2063"/>
      <stop offset="60%" stop-color="#a24d6e"/>
      <stop offset="80%" stop-color="#e08a4f"/>
      <stop offset="100%" stop-color="#f6b25a"/>
    </linearGradient>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe3a3" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f7a94a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f7a94a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="montanha1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2650"/>
      <stop offset="100%" stop-color="#241735"/>
    </linearGradient>
    <linearGradient id="montanha2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c3f"/>
      <stop offset="100%" stop-color="#180f26"/>
    </linearGradient>
    <linearGradient id="asfalto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4358"/>
      <stop offset="100%" stop-color="#16121e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#ceu)"/>
  <circle cx="1180" cy="330" r="230" fill="url(#sol)"/>
  <circle cx="1180" cy="330" r="95" fill="#ffdca0"/>

  <!-- estrelas discretas na parte de cima -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="90" r="1.6"/>
    <circle cx="260" cy="150" r="1.2"/>
    <circle cx="400" cy="70" r="1.4"/>
    <circle cx="700" cy="110" r="1.1"/>
    <circle cx="90" cy="220" r="1.3"/>
    <circle cx="1500" cy="120" r="1.5"/>
    <circle cx="1400" cy="60" r="1.1"/>
  </g>

  <!-- montanhas ao fundo -->
  <path d="M0,560 L150,470 L300,540 L480,430 L650,540 L820,460 L1000,550 L1180,480 L1360,560 L1600,500 L1600,650 L0,650 Z" fill="url(#montanha2)"/>
  <path d="M0,610 L200,530 L420,600 L600,510 L800,600 L1020,520 L1250,610 L1450,540 L1600,600 L1600,700 L0,700 Z" fill="url(#montanha1)"/>

  <!-- pista -->
  <path d="M0,900 L0,760 L620,640 L980,640 L1600,760 L1600,900 Z" fill="url(#asfalto)"/>
  <path d="M0,760 L620,640 L980,640 L1600,760 L1600,790 L980,672 L620,672 L0,790 Z" fill="#0f0c16" opacity="0.5"/>

  <!-- faixa central tracejada, em perspectiva -->
  <g fill="#f5d488" opacity="0.85">
    <polygon points="792,660 808,660 818,700 782,700"/>
    <polygon points="778,712 822,712 838,762 762,762"/>
    <polygon points="758,776 842,776 864,838 736,838"/>
    <polygon points="730,850 870,850 900,900 700,900"/>
  </g>

  <!-- acostamentos -->
  <path d="M620,640 L600,672 L0,790 L0,760 Z" fill="#e8c98a" opacity="0.35"/>
  <path d="M980,640 L1000,672 L1600,790 L1600,760 Z" fill="#e8c98a" opacity="0.35"/>

  <!-- silhueta de árvores/postes ao longo da estrada -->
  <g fill="#1c1428" opacity="0.9">
    <rect x="120" y="600" width="6" height="60"/>
    <circle cx="123" cy="595" r="22"/>
    <rect x="1440" y="600" width="6" height="60"/>
    <circle cx="1443" cy="595" r="22"/>
    <rect x="60" y="660" width="7" height="70"/>
    <circle cx="63" cy="654" r="26"/>
    <rect x="1500" y="655" width="7" height="72"/>
    <circle cx="1503" cy="649" r="27"/>
  </g>

  <!-- caminhão / carreta, visto de trás, se afastando na estrada -->
  <g transform="translate(760,560) scale(1.05)">
    <!-- sombra -->
    <ellipse cx="60" cy="146" rx="95" ry="14" fill="#000000" opacity="0.35"/>

    <!-- baú da carreta -->
    <rect x="0" y="18" width="120" height="108" rx="6" fill="#dfe3ea"/>
    <rect x="0" y="18" width="120" height="108" rx="6" fill="#000000" opacity="0.12"/>
    <rect x="8" y="26" width="104" height="92" rx="3" fill="#c9ced8"/>
    <rect x="8" y="26" width="104" height="8" fill="#aeb4c2"/>

    <!-- luzes traseiras -->
    <rect x="10" y="112" width="14" height="10" rx="2" fill="#ff5c5c"/>
    <rect x="96" y="112" width="14" height="10" rx="2" fill="#ff5c5c"/>

    <!-- cabine (mal aparece atrás do baú, indicando profundidade) -->
    <rect x="18" y="0" width="84" height="22" rx="4" fill="#b7bdc9"/>

    <!-- para-choque e rodas -->
    <rect x="-4" y="124" width="128" height="10" rx="3" fill="#2b2b33"/>
    <circle cx="24" cy="140" r="14" fill="#111116"/>
    <circle cx="24" cy="140" r="6" fill="#5b5b66"/>
    <circle cx="96" cy="140" r="14" fill="#111116"/>
    <circle cx="96" cy="140" r="6" fill="#5b5b66"/>
  </g>

  <!-- véu escuro para dar contraste ao card de login -->
  <rect width="1600" height="900" fill="#0b0710" opacity="0.35"/>
</svg>
